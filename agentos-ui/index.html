<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Platform</title>
    <script>
      // Error handler BEFORE any imports (imports are hoisted)
      window.onerror = function(msg, url, line, col, error) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="color:#ff4d6d;background:#0a0d1a;padding:24px;font-family:monospace;white-space:pre-wrap">' +
            '<b>JAVASCRIPT ERROR:</b>\n' + msg + '\nLine: ' + line + ':' + col + '\nFile: ' + url + '\n\n' +
            (error && error.stack ? error.stack : error && error.message ? error.message : 'No stack trace') +
            '</div>';
        }
        return false;
      };
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('root');
        if (el) {
          el.innerHTML = '<div style="color:#ffb347;background:#0a0d1a;padding:24px;font-family:monospace;white-space:pre-wrap">' +
            '<b>UNHANDLED PROMISE REJECTION:</b>\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason && e.reason.message ? e.reason.message : String(e.reason)) +
            '</div>';
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
